<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- White background -->
  <rect width="32" height="32" fill="#FFFFFF"/>
  <!-- Ink border -->
  <rect x="0" y="0" width="32" height="2" fill="#3B3B3B"/>
  <rect x="0" y="30" width="32" height="2" fill="#3B3B3B"/>
  <rect x="0" y="0" width="2" height="32" fill="#3B3B3B"/>
  <rect x="30" y="0" width="2" height="32" fill="#3B3B3B"/>
  <!-- Teal isometric cube -->
  <!-- Top face -->
  <polygon points="16,8 24,12 16,16 8,12" fill="#03CDD7"/>
  <!-- Left face -->
  <polygon points="8,12 16,16 16,24 8,20" fill="#029BA3"/>
  <!-- Right face -->
  <polygon points="24,12 16,16 16,24 24,20" fill="#02B8C1"/>
</svg>
